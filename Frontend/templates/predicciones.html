<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Predicción de Precio - Plataforma</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- Particles.js Background -->
    <div id="particles-js"></div>

    <!-- Contenedor completo de pantalla -->
    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="welcome-card-form">
                        <h1 class="card-title text-center mb-4">Haz tu Predicción</h1>

                        <form action="/predicciones" id="form" method="POST" class="mb-4">
                            <div class="form-group mt-3">
                                <label for="area">Área total en metros cuadrados:</label>
                                <input type="number" id="area" name="area" class="form-control">
                            </div>

                            <div class="form-group mt-3">
                                <label for="tipo_vivienda">Tipo de vivienda:</label>
                                <select id="tipo_vivienda" name="tipo_vivienda" class="form-control">
                                    <option value="CASA">Casa</option>
                                    <option value="APARTAMENTO">Apartamento</option>
                                    <option value="OTRO">Otro</option>
                                </select>
                            </div>

                            <div class=" d-flex justify-content-center gap-3 mt-4">
                                <button type="submit" class="btn btn-custom btn-form">
                                    <i class="bi bi-building-add me-2"></i> Predecir Precio
                                </button>

                
                                <a href="home.html" class="btn btn-custom btn-inicio">
                                    <i class="bi bi-house-check"></i> Inicio
                                </a>
                            </div>   
                        </form>
                        <!-- Modal para mostrar el resultado de la predicción -->
                        <div class="modal fade" id="resultadoModal" tabindex="-1" aria-labelledby="resultadoModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="resultadoModalLabel">Resultado de la Predicción</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body text-center">
                                        <h4>El precio estimado de la vivienda es:</h4>
                                        <h2 id="resultado" style="font-size: 2.5rem; font-weight: bold;"></h2>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/validaciones.js') }}"></script>
    <script src="{{ url_for('static', filename='js/particulas.js') }}"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    {% if prediccion %}
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const modal = new bootstrap.Modal(document.getElementById('resultadoModal'));
                modal.show();
            });
        </script>
    {% endif %}


</body>
</html>
